name: Verify KnowHub
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowhub
          POSTGRES_PASSWORD: knowhub-local-only
          POSTGRES_DB: knowhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knowhub" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      KNOWHUB_TEST_DATABASE_URL: postgresql://knowhub:knowhub-local-only@localhost:5432/knowhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check knowhub tests scripts
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
