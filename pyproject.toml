[project]
name = "knowhub"
version = "0.2.0"
description = "Evidence-grounded knowledge retrieval and ticket operations agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "numpy>=2,<3",
  "sentence-transformers>=3.4,<6", "rank-bm25>=0.2.2,<1",
  "langgraph>=1,<2", "pypdf>=5,<7", "python-multipart>=0.0.20,<1",
  "mcp>=1.20,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
