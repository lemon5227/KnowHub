services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowhub
      POSTGRES_PASSWORD: knowhub-local-only
      POSTGRES_DB: knowhub
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - knowhub_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowhub"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  knowhub_db:
